<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1220" viewBox="0 0 1600 1220" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>SpeakWith status monitor — the floating mode panel</title>
  <desc>Vector recreation of the floating status monitor SpeakWith shows while the live-direct mic is held, with callouts for its parts, the five mode words and colours, the screen furniture it does not need, and the Dock badge fallback.</desc>
  <!--
    Maintainer note (not rendered):
    - Source of truth for words and hues: LiveDictationModeDot.swift (shortLabel / color).
    - Panel layout: ModeStatusHUDPanel.swift (mark 18pt, dot 9pt, caption + caption2, capsule on Material.bar).
    - Detail line "Into open field": ModeStatusHUDPresentation.resolve (fieldDictationOn).
    - Dock badge words: DockBadgeLabel.swift (REC / TYPE / pause), always system red.
    - Regenerate with doc/assets/status-monitor-annotated/gen_status_monitor.py <outdir> (dark).
  -->
  <defs>
    <linearGradient id="markGrad" x1="512" y1="200" x2="512" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5e1ad"/><stop offset="1" stop-color="#c4994e"/>
    </linearGradient>
    <style>
      .title { font-size: 40px; font-weight: 700; fill: #F2F2F7; }
      .subtitle { font-size: 22px; fill: #AEAEB2; }
      .h2 { font-size: 26px; font-weight: 700; fill: #F2F2F7; }
      .box { fill: #262628; stroke: #48484A; stroke-width: 1.5; }
      .box-head { font-size: 20px; font-weight: 700; fill: #F2F2F7; }
      .box-body { font-size: 17px; fill: #D1D1D6; }
      .note { font-size: 16px; fill: #8E8E93; font-style: italic; }
      .leader { stroke: #FF9F0A; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .pin-num { font-size: 22px; font-weight: 700; fill: #1C1C1E; text-anchor: middle; }
      .win { fill: #2C2C2E; stroke: #3A3A3C; stroke-width: 2; }
      .win-line { stroke: #48484A; stroke-width: 10; stroke-linecap: round; }
      .cap { font-size: 17px; fill: #D1D1D6; }
      .cap-b { font-size: 18px; font-weight: 700; fill: #F2F2F7; }
      .chip { fill: #2C2C2E; stroke: #48484A; stroke-width: 1.5; }
      .chip-t { font-size: 18px; font-weight: 600; fill: #F2F2F7; }
      .check { fill: #30D158; }
    </style>
  </defs>
  <rect width="1600" height="1220" fill="#1C1C1E"/>
  <rect x="1.5" y="1.5" width="1597" height="1217" rx="26.9" fill="none" stroke="#54545A" stroke-width="3"/>

  <text class="title" x="80" y="82">The floating status monitor</text>
  <text class="subtitle" x="80" y="118">A small pill that stays on top while the live-direct mic is held. It tells you the mode at a glance, from anywhere on the screen.</text>
  <g id="other-app">
    <rect class="win" x="80" y="170" width="1000" height="330" rx="14"/>
    <circle cx="108" cy="196" r="7" fill="#48484A"/><circle cx="130" cy="196" r="7" fill="#48484A"/><circle cx="152" cy="196" r="7" fill="#48484A"/>
    <line class="win-line" x1="120" y1="240" x2="720" y2="240"/>
    <line class="win-line" x1="120" y1="440" x2="560" y2="440"/>
    <line class="win-line" x1="120" y1="476" x2="380" y2="476"/>
    <rect x="386" y="465" width="3" height="22" fill="#F2F2F7"/>
    <text class="note" x="920" y="480" text-anchor="end">the app you are working in; the monitor floats above it</text>
  </g>
<g>
  <rect x="250" y="290" width="823.2" height="168.0" rx="84.0" fill="#3A3A3C" stroke="#5A5A5E" stroke-width="6.3"/>
