  <rect width="29.7" height="29.7" rx="6.6" fill="#1A1A1A"/>
  <svg x="0" y="0" width="29.7" height="29.7" viewBox="0 0 1024 1024"><path fill="none" stroke="url(#markGrad)" stroke-width="65" stroke-linecap="round" d="M 374 240 C 1124 400 -100 624 650 784"/>
<path fill="none" stroke="url(#markGrad)" stroke-width="65" stroke-linecap="round" d="M 650 240 C -100 400 1124 624 374 784"/>
<path fill="none" stroke="url(#markGrad)" stroke-width="65" d="M 605.330017 426.030029 C 560.880005 482.76001 463.140015 541.219971 418.679993 597.960022"/></svg>
</g>
  <circle cx="1332.5" cy="639.0" r="7.4" fill="#30D158"/>
  <text x="1351.4" y="646.4" font-size="20.6" font-weight="600" fill="#F2F2F7">Monitoring</text>
</g>  <text class="cap" x="1272" y="706">The mic is held and metering,</text>
  <text class="cap" x="1272" y="728">with no take running.</text>
  <text class="note" x="80" y="762">Listening is level mode: a hardware mute switch drops the level, so muting pauses the recorder and unmuting resumes it. No key, no click.</text>
  <text class="note" x="80" y="786">When more than one applies, the panel shows the highest: Voice pull, then Type into app, then Recording. Batch capture and Off show no panel at all.</text>
  <text class="h2" x="80" y="846">Nothing else to keep on screen</text>
  <g>
    <rect class="chip" x="80" y="868" width="242" height="46" rx="23"/>
    <path class="check" d="M 100 891 l 7 7 l 14 -15 l 4 4 l -18 19 l -11 -11 z"/>
    <text class="chip-t" x="132" y="898">Menu bar hidden</text>
  </g>
  <g>
    <rect class="chip" x="338.5" y="868" width="196" height="46" rx="23"/>
    <path class="check" d="M 358.5 891 l 7 7 l 14 -15 l 4 4 l -18 19 l -11 -11 z"/>
    <text class="chip-t" x="390.5" y="898">Dock hidden</text>
  </g>
  <g>
    <rect class="chip" x="551.0" y="868" width="380" height="46" rx="23"/>
    <path class="check" d="M 571.0 891 l 7 7 l 14 -15 l 4 4 l -18 19 l -11 -11 z"/>
    <text class="chip-t" x="603.0" y="898">SpeakWith in the background</text>
  </g>
  <text class="cap" x="80" y="950">The panel is its own small window. It takes no menu-bar slot, needs no Dock, and never takes keyboard focus. Drag it anywhere once; it stays there.</text>
  <text class="h2" x="80" y="1032">If you keep the Dock showing</text>
  <g id="dock-fallback">
