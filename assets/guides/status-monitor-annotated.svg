  <circle cx="1036.5" cy="639.0" r="7.4" fill="#FF9F0A"/>
  <text x="1055.4" y="646.4" font-size="20.6" font-weight="600" fill="#F2F2F7">Listening</text>
</g>  <text class="cap" x="976" y="706">Level mode standby: mic held,</text>
  <text class="cap" x="976" y="728">a take starts when you speak up.</text>
<g>
  <rect x="1264" y="606" width="272" height="66" rx="33.0" fill="#3A3A3C" stroke="#5A5A5E" stroke-width="2.5"/>
