    <text class="box-head" x="1168" y="258">Mode colour</text>
    <text class="box-body" x="1168" y="280">Red, blue, indigo, orange, or green.</text>
    <text class="box-body" x="1168" y="300">Optionally pulses while the mic is held.</text>
    <path class="leader" d="M 1120 271 L 1090 271 Q 484 264 446 264 L 446 264 Q 424 264 424 286 L 424 347"/>
    <circle cx="424" cy="347" r="5" fill="#FF9F0A"/>
