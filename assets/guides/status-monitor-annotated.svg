  <text class="cap-b" x="480" y="1082">The Dock badge is the fallback.</text>
  <text class="cap" x="480" y="1108">It reads REC while recording, TYPE while typing into another app, and a pause mark while listening.</text>
  <text class="cap" x="480" y="1132">macOS paints every Dock badge the same red, so it cannot colour-code the modes. Only the floating monitor can.</text>
  <text class="note" x="80" y="1192">Direct download builds only. Settings, Dictation, Type into app: Show mode indicator.</text>
</svg>
