  <g id="callout-3">
    <rect class="box" x="1120" y="324" width="400" height="78" rx="10"/>
    <text class="box-head" x="1168" y="350">Mode word</text>
    <text class="box-body" x="1168" y="372">The colour never stands alone: the word</text>
    <text class="box-body" x="1168" y="392">beside the dot says the same thing.</text>
    <path class="leader" d="M 1120 363 L 1090 363 Q 1000 363 848 348"/>
    <circle cx="848" cy="348" r="5" fill="#FF9F0A"/>
    <circle cx="1142" cy="363" r="19" fill="#FF9F0A"/><text x="1142" y="371" class="pin-num">3</text>
  </g>
  <g id="callout-4">
    <rect class="box" x="1120" y="416" width="400" height="78" rx="10"/>
    <text class="box-head" x="1168" y="442">Detail line</text>
    <text class="box-body" x="1168" y="464">Shown only when it adds something, for</text>
    <text class="box-body" x="1168" y="484">example dictation into an open text field.</text>
    <path class="leader" d="M 1120 455 L 1090 455 Q 1000 455 813 424"/>
    <circle cx="813" cy="424" r="5" fill="#FF9F0A"/>
    <circle cx="1142" cy="455" r="19" fill="#FF9F0A"/><text x="1142" y="463" class="pin-num">4</text>
  </g>
  <text class="h2" x="80" y="580">The five modes</text>
