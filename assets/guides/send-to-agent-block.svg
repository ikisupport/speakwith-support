<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="860" viewBox="0 0 1480 860" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Agent tab ready to send chapter 4</title>
  <desc>The Agent tab with status line Claude Code, lighthouse-book, default model, two topic previews, the instruction, and Send to agent.</desc>
  <defs><style>
      .title { font-size: 32px; font-weight: 700; fill: #F2F2F7; }
      .sub { font-size: 18px; fill: #AEAEB2; }
      .card { fill: #232325; stroke: #3A3A3C; stroke-width: 1.5; }
      .head { font-size: 20px; font-weight: 650; fill: #F2F2F7; }
      .lbl { font-size: 16px; fill: #AEAEB2; }
      .val { font-size: 16px; fill: #F2F2F7; }
      .strong { font-size: 17px; font-weight: 650; fill: #F2F2F7; }
      .body { font-size: 15px; fill: #AEAEB2; }
      .off { font-size: 17px; fill: #636366; }
      .offbody { font-size: 15px; fill: #636366; }
      .cap { font-size: 15px; fill: #8E8E93; }
      .tile { fill: #2C2C2E; stroke: #3A3A3C; stroke-width: 1; }
      .field { fill: #2C2C2E; stroke: #48484A; stroke-width: 1.5; }
      .box { fill: #262628; stroke: #48484A; stroke-width: 1.5; }
      .box-head { font-size: 18px; font-weight: 700; fill: #F2F2F7; }
      .box-body { font-size: 16px; fill: #D1D1D6; }
      .doc-h { font-size: 18px; font-weight: 700; fill: #F2F2F7; }
      .doc { font-size: 16px; fill: #F2F2F7; }
      .pin-num { font-size: 20px; font-weight: 700; fill: #1C1C1E; text-anchor: middle; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px; fill: #F2F2F7; }
      .mono-dim { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #8E8E93; }
      .mono-prompt { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 650; fill: #32D74B; }
      .mono-h { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 700; fill: #F2F2F7; }
    </style></defs>
  <rect width="1480" height="860" fill="#1C1C1E"/>
  <rect x="1.5" y="1.5" width="1477" height="857" rx="24.9" fill="none" stroke="#54545A" stroke-width="3"/>
  <text class="title" x="64" y="72">In the Agent tab</text>
  <text class="sub" x="64" y="108">Destination is already set. The send controls are on this tab, just before the press.</text>
  <rect class="card" x="64" y="140" width="760" height="660" rx="12"/>
  <text class="head" x="88" y="180">Agent</text>
  <text class="val" x="88" y="224">Claude Code · lighthouse-book · default model</text>
  <text class="cap" x="88" y="264">2 topics will be sent as one prompt turn.</text>
  <rect class="tile" x="88" y="290" width="712" height="84" rx="8"/>
  <text class="strong" x="104" y="322">The storm scene</text>
  <text class="body" x="104" y="348">The keeper hears the lantern glass crack. The light goes out.</text>
  <rect class="tile" x="88" y="390" width="712" height="84" rx="8"/>
  <text class="strong" x="104" y="422">Names to keep</text>
  <text class="body" x="104" y="448">The keeper is Mara Voss. Her brother is Eli Voss.</text>
  <rect class="field" x="88" y="494" width="712" height="110" rx="8"/>
  <text class="body" x="104" y="530">Write chapter 4 from these notes only, as</text>
  <text class="body" x="104" y="554">chapters/04-the-storm.md. Keep every name as written.</text>
  <text class="body" x="104" y="578">Do not add a character.</text>
  <rect x="88" y="630" width="168" height="36" rx="8" fill="#0A84FF"/>
  <text x="172" y="654" font-size="15" font-weight="650" fill="#FFFFFF" text-anchor="middle">Send to agent</text>
  <text class="cap" x="268" y="654">Nothing is sent until this press.</text>
  <g>
    <rect class="box" x="880" y="160" width="540" height="100" rx="10"/>
    <circle cx="902" cy="188" r="16" fill="#FF9F0A"/>
    <text x="902" y="195" class="pin-num">1</text>
    <text class="box-head" x="928" y="194">Status line</text>
    <text class="box-body" x="928" y="222">Agent, folder, and model, in that order.</text>
  </g>
  <g>
    <rect class="box" x="880" y="300" width="540" height="100" rx="10"/>
    <circle cx="902" cy="328" r="16" fill="#FF9F0A"/>
    <text x="902" y="335" class="pin-num">2</text>
    <text class="box-head" x="928" y="334">The caption</text>
    <text class="box-body" x="928" y="362">Two topics, one message. Read this before you press.</text>
  </g>
  <g>
    <rect class="box" x="880" y="470" width="540" height="100" rx="10"/>
    <circle cx="902" cy="498" r="16" fill="#FF9F0A"/>
    <text x="902" y="505" class="pin-num">3</text>
    <text class="box-head" x="928" y="504">Optional instruction</text>
    <text class="box-body" x="928" y="532">This names the file. The topics do not.</text>
  </g>
  <g>
    <rect class="box" x="880" y="640" width="540" height="100" rx="10"/>
    <circle cx="902" cy="668" r="16" fill="#FF9F0A"/>
    <text x="902" y="675" class="pin-num">4</text>
    <text class="box-head" x="928" y="674">Send to agent</text>
    <text class="box-body" x="928" y="702">The only button that hands the job over.</text>
  </g>
</svg>
