<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>SpeakWith AI Usage, an example</title>
  <desc>Constructed diagram of the AI Usage window with example figures: a 47 percent gauge, call counts, and daily bars. The numbers are invented for the guide.</desc>
  <defs>
    <style>
      .title { font-size: 40px; font-weight: 700; fill: #1D1D1F; }
      .subtitle { font-size: 22px; fill: #515154; }
      .win-title { font-size: 18px; font-weight: 650; fill: #1D1D1F; }
      .example { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #C93400; }
      .row-label { font-size: 20px; font-weight: 650; fill: #1D1D1F; }
      .period { font-size: 18px; font-weight: 650; fill: #515154; }
      .pct { font-size: 22px; font-weight: 700; fill: #1D1D1F; }
      .caption { font-size: 17px; fill: #3A3A3C; }
      .box-head { font-size: 18px; font-weight: 700; fill: #1D1D1F; }
      .counts { font-size: 22px; font-weight: 650; fill: #1D1D1F; }
      .box-body { font-size: 17px; fill: #3A3A3C; }
      .mac { font-size: 16px; font-weight: 650; fill: #6E6E73; }
      .chart-title { font-size: 20px; font-weight: 700; fill: #1D1D1F; }
      .seg { font-size: 15px; font-weight: 650; }
      .axis { font-size: 14px; fill: #6E6E73; }
      .legend { font-size: 15px; fill: #3A3A3C; }
      .box-call { fill: #F2F2F7; stroke: #D2D2D7; stroke-width: 1.5; }
      .call-head { font-size: 18px; font-weight: 700; fill: #1D1D1F; }
      .call-body { font-size: 16px; fill: #3A3A3C; }
      .leader { stroke: #D70015; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .pin-num { font-size: 18px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1600" height="1060" fill="#F5F5F7"/>
  <rect x="1.5" y="1.5" width="1597" height="1057" rx="26" fill="none" stroke="#B0B0B8" stroke-width="3"/>
  <text class="title" x="56" y="78">Viewing your AI usage</text>
  <text class="subtitle" x="56" y="116">Example figures, drawn for this guide. Not a reading from a real membership.</text>
  <g id="window">
    <rect x="48" y="148" width="1000" height="860" rx="16" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="2"/>
    <circle cx="76" cy="174" r="6" fill="#D2D2D7"/>
    <circle cx="96" cy="174" r="6" fill="#D2D2D7"/>
    <circle cx="116" cy="174" r="6" fill="#D2D2D7"/>
    <text class="win-title" x="548.0" y="180" text-anchor="middle">AI Usage</text>
    <text class="example" x="1016" y="179" text-anchor="end">EXAMPLE</text>
    <line x1="64" y1="200" x2="1032" y2="200" stroke="#D2D2D7" stroke-width="1"/>
    <text class="row-label" x="80" y="236">Included with your plan</text>
    <text class="period" x="1016" y="236" text-anchor="end">this month</text>
    <rect x="80" y="254" width="760" height="26" rx="13" fill="#E5E5EA"/>
    <rect x="80" y="254" width="357.2" height="26" rx="13" fill="#007AFF"/>
    <text class="pct" x="858" y="274">47%</text>
    <text class="caption" x="80" y="312">You have used 47% of the AI included with your plan this month.</text>
    <rect x="80" y="330" width="936" height="168" rx="12" fill="#F2F2F7" stroke="#D2D2D7" stroke-width="1.5"/>
    <text class="box-head" x="102" y="362">What you did with it</text>
    <text class="counts" x="102" y="398">126 polishes  ·  58 titles  ·  7 regenerates</text>
    <text class="box-body" x="102" y="430">…and 12 more on your own key, which your plan is not</text>
    <text class="box-body" x="102" y="452">charged for.</text>
    <text class="mac" x="102" y="480">Counted on this Mac.</text>
    <text class="chart-title" x="80" y="538">Your usage per day</text>
    <rect x="748" y="514" width="268" height="36" rx="9" fill="#FFFFFF" stroke="#C7C7CC" stroke-width="1.5"/>
    <rect x="751" y="517" width="130.0" height="30" rx="7" fill="#007AFF"/>
    <text class="seg" x="815.0" y="537" text-anchor="middle" fill="#FFFFFF">By feature</text>
    <text class="seg" x="949.0" y="537" text-anchor="middle" fill="#515154">By model</text>
    <text class="mac" x="80" y="564">Counted on this Mac.</text>
    <line x1="126" y1="584.0" x2="1016" y2="584.0" stroke="#D2D2D7" stroke-width="1"/>
    <text class="axis" x="116" y="588.0" text-anchor="end">40k</text>
    <line x1="126" y1="709.0" x2="1016" y2="709.0" stroke="#D2D2D7" stroke-width="1"/>
    <text class="axis" x="116" y="713.0" text-anchor="end">20k</text>
    <line x1="126" y1="834.0" x2="1016" y2="834.0" stroke="#D2D2D7" stroke-width="1"/>
    <text class="axis" x="116" y="838.0" text-anchor="end">0</text>
    <rect x="178.2" y="596.5" width="44" height="237.5" fill="#8E8E93"/>
    <text class="axis" x="200.2" y="856" text-anchor="middle">earlier</text>
    <rect x="326.5" y="745.2" width="44" height="88.8" fill="#007AFF"/>
    <rect x="326.5" y="732.1" width="44" height="13.1" fill="#C93400"/>
    <text class="axis" x="348.5" y="856" text-anchor="middle">Nov 1</text>
    <rect x="474.8" y="772.8" width="44" height="61.2" fill="#007AFF"/>
    <rect x="474.8" y="764.0" width="44" height="8.8" fill="#C93400"/>
    <rect x="474.8" y="758.4" width="44" height="5.6" fill="#5856D6"/>
    <text class="axis" x="496.8" y="856" text-anchor="middle">Nov 2</text>
    <rect x="623.2" y="724.6" width="44" height="109.4" fill="#007AFF"/>
    <rect x="623.2" y="708.4" width="44" height="16.2" fill="#C93400"/>
    <text class="axis" x="645.2" y="856" text-anchor="middle">Nov 3</text>
    <rect x="771.5" y="757.1" width="44" height="76.9" fill="#007AFF"/>
    <rect x="771.5" y="745.2" width="44" height="11.9" fill="#C93400"/>
    <rect x="771.5" y="737.8" width="44" height="7.5" fill="#5856D6"/>
    <text class="axis" x="793.5" y="856" text-anchor="middle">Nov 4</text>
    <rect x="919.8" y="794.0" width="44" height="40.0" fill="#007AFF"/>
    <rect x="919.8" y="789.0" width="44" height="5.0" fill="#C93400"/>
    <text class="axis" x="941.8" y="856" text-anchor="middle">Nov 5</text>
    <rect x="80" y="874" width="16" height="16" rx="3" fill="#8E8E93"/>
    <text class="legend" x="104" y="888">earlier</text>
    <rect x="209" y="874" width="16" height="16" rx="3" fill="#007AFF"/>
    <text class="legend" x="233" y="888">Polish</text>
    <rect x="327" y="874" width="16" height="16" rx="3" fill="#C93400"/>
    <text class="legend" x="351" y="888">Titles</text>
    <rect x="445" y="874" width="16" height="16" rx="3" fill="#5856D6"/>
    <text class="legend" x="469" y="888">Regenerate</text>
  </g>
  <g id="callout-1">
    <path class="leader" d="M 1088 230 L 1060 230 Q 1060 230 1024 230"/>
    <circle cx="1024" cy="230" r="5" fill="#D70015"/>
    <rect class="box-call" x="1088" y="194" width="468" height="72" rx="10"/>
    <text class="call-head" x="1132" y="220">The period</text>
    <text class="call-body" x="1132" y="242">This month on a paid month.</text>
    <text class="call-body" x="1132" y="260">A trial reads this week.</text>
    <circle cx="1110" cy="230" r="16" fill="#D70015"/><text x="1110" y="236" class="pin-num">1</text>
  </g>
  <g id="callout-2">
    <path class="leader" d="M 1088 316 L 1060 316 Q 952 316 916 266"/>
    <circle cx="916" cy="266" r="5" fill="#D70015"/>
    <rect class="box-call" x="1088" y="280" width="468" height="72" rx="10"/>
    <text class="call-head" x="1132" y="306">Every device</text>
    <text class="call-body" x="1132" y="328">The gauge totals every device.</text>
    <text class="call-body" x="1132" y="346">It prints a percentage only.</text>
    <circle cx="1110" cy="316" r="16" fill="#D70015"/><text x="1110" y="322" class="pin-num">2</text>
  </g>
  <g id="callout-3">
    <path class="leader" d="M 1088 402 L 1060 402 Q 1044 402 1008 392"/>
    <circle cx="1008" cy="392" r="5" fill="#D70015"/>
    <rect class="box-call" x="1088" y="366" width="468" height="72" rx="10"/>
    <text class="call-head" x="1132" y="392">Counts, not tokens</text>
    <text class="call-body" x="1132" y="414">Polishes, titles, regenerates.</text>
    <text class="call-body" x="1132" y="432">How many times, not tokens.</text>
    <circle cx="1110" cy="402" r="16" fill="#D70015"/><text x="1110" y="408" class="pin-num">3</text>
  </g>
  <g id="callout-4">
    <path class="leader" d="M 1088 488 L 1060 488 Q 1044 488 1008 475"/>
    <circle cx="1008" cy="475" r="5" fill="#D70015"/>
    <rect class="box-call" x="1088" y="452" width="468" height="72" rx="10"/>
    <text class="call-head" x="1132" y="478">This Mac</text>
    <text class="call-body" x="1132" y="500">The counts and the bars are</text>
    <text class="call-body" x="1132" y="518">this Mac only.</text>
    <circle cx="1110" cy="488" r="16" fill="#D70015"/><text x="1110" y="494" class="pin-num">4</text>
  </g>
  <g id="callout-5">
    <path class="leader" d="M 1088 574 L 1060 574 Q 1060 574 1024 532"/>
    <circle cx="1024" cy="532" r="5" fill="#D70015"/>
    <rect class="box-call" x="1088" y="538" width="468" height="72" rx="10"/>
    <text class="call-head" x="1132" y="564">By feature or By model</text>
    <text class="call-body" x="1132" y="586">The only switch on the page.</text>
    <text class="call-body" x="1132" y="604">It recolours the same days.</text>
    <circle cx="1110" cy="574" r="16" fill="#D70015"/><text x="1110" y="580" class="pin-num">5</text>
  </g>
  <g id="callout-6">
    <path class="leader" d="M 1088 660 L 1080 660 Q 1064 660 1064 626 Q 1064 592 1028 592 L 222 592"/>
    <circle cx="222" cy="592" r="5" fill="#D70015"/>
    <rect class="box-call" x="1088" y="624" width="468" height="72" rx="10"/>
    <text class="call-head" x="1132" y="650">The grey column</text>
    <text class="call-body" x="1132" y="672">Counted on this Mac, and not</text>
    <text class="call-body" x="1132" y="690">split into a feature or a model.</text>
    <circle cx="1110" cy="660" r="16" fill="#D70015"/><text x="1110" y="666" class="pin-num">6</text>
  </g>
</svg>
