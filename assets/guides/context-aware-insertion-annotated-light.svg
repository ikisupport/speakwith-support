<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>SpeakWith: how a typed-in phrase finds its spacing</title>
  <desc>Two figures. Figure A, what it looks at: four rows, each a text field with a cursor, the same spoken word, and the field afterwards. The one character before the cursor and the one after it are circled and joined by leader lines to a label. After a word, one space is added. After a space, none. Before a period, one space in front and none after. A selected word is replaced and the spacing is read from outside the selection. Figure B, when the field will not say: four panels. Legible, opaque, and silent fields each receive the same two phrases, with the spacing each kind of field gets. A trimming field eats a pasted leading space and keeps a typed one.</desc>
  <!--
    Maintainer note (not rendered):
    - Figure A is DictationSpacing.edges(before:after:) (macos/SpeakWith/SpeakWith/TCA/SystemDictation/DictationSpacing.swift):
      one space against a word, none against whitespace, an edge, closing punctuation, or a joiner.
      nil on either side means an edge OR a context that could not be read; both are spaced the same way.
    - Figure B panels are the behaviour classes TextInjectionClient.inject meets: a legible field gets the full
      rule; an empty kAXValue is distrusted (FocusedFieldRead.context == .emptyValue) and a missing one is
      .unavailable, both falling back to start-of-field spacing plus the Punctuation-off join space; a field
      that trims pasted leading whitespace is handled by typing the one leading space as a keystroke
      (typesLeadingSpace) and pasting the rest.
    - No destination app is named anywhere in this poster, by design.
    - Regenerate with guide_design/context_aware_insertion/gen_context_aware_insertion.py <outdir> (light).
  -->
  <defs>
    <style>
      .title { font-size: 40px; font-weight: 700; fill: #1D1D1F; }
      .subtitle { font-size: 22px; fill: #515154; }
