<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1350" viewBox="0 0 1600 1350" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Practising a language aloud with SpeakWith, annotated</title>
  <desc>Vector recreation of the SpeakWith settings rows, live recorder header, polish chip and day document that make up spoken input language and translating polish, with six numbered callouts.</desc>
  <defs>
    <style>
      .field { fill: #1C1C1E; }
      .chrome { fill: #2C2C2E; stroke: #3A3A3C; stroke-width: 2; }
      .title { font-size: 40px; font-weight: 700; fill: #F2F2F7; }
      .subtitle { font-size: 22px; fill: #AEAEB2; }
      .panel-tag { font-size: 17px; font-weight: 700; letter-spacing: 0.08em; fill: #8E8E93; }
      .sec { font-size: 18px; font-weight: 700; fill: #AEAEB2; }
      .row-label { font-size: 23px; fill: #F2F2F7; }
      .row-value { font-size: 23px; fill: #AEAEB2; text-anchor: end; }
      .chip { fill: #3A3A3C; stroke: #545458; stroke-width: 1.5; }
      .chip-text { font-size: 20px; font-weight: 600; fill: #F2F2F7; text-anchor: middle; }
      .badge { font-family: "SF Mono", Menlo, "JetBrains Mono", monospace; font-size: 30px; fill: #8E8E93; white-space: pre; }
      .box { fill: #262628; stroke: #48484A; stroke-width: 1.5; }
      .box-head { font-size: 22px; font-weight: 700; fill: #F2F2F7; }
      .box-body { font-size: 18px; fill: #D1D1D6; }
      .box-note { font-size: 16px; fill: #8E8E93; font-style: italic; }
      .leader { stroke: #FF9F0A; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .dot { fill: #FF9F0A; }
      .pin { fill: #FF9F0A; }
      .pin-num { font-size: 22px; font-weight: 700; fill: #1C1C1E; text-anchor: middle; }
      .doc { fill: #232325; stroke: #3A3A3C; stroke-width: 1.5; }
      .doc-head { font-family: "SF Mono", Menlo, "JetBrains Mono", monospace; font-size: 22px; font-weight: 700; fill: #F2F2F7; }
      .doc-body { font-size: 24px; fill: #D1D1D6; }
      .doc-trans { font-size: 24px; fill: #9BD6FF; }
      .stamp { font-family: "SF Mono", Menlo, "JetBrains Mono", monospace; font-size: 15px; fill: #6E6E73; }
      .foot { font-size: 18px; fill: #8E8E93; }
      .foot-b { font-size: 18px; fill: #AEAEB2; font-weight: 600; }
    </style>
  </defs>

  <rect class="field" width="1600" height="1350"/>
  <rect x="1.5" y="1.5" width="1597" height="1347" rx="26.9" fill="none" stroke="#54545A" stroke-width="3"/>

  <text class="title" x="90" y="82">Practise a language aloud</text>
  <text class="subtitle" x="90" y="122">Dictate in the language you are learning, and read the translation under your own words.</text>
  <g id="settings-engine">
    <rect class="chrome" x="90" y="175" width="690" height="160" rx="16"/>
    <text class="panel-tag" x="118" y="211">SETTINGS · ENGINE</text>
    <text class="sec" x="118" y="248">Dictation language</text>
    <text class="row-label" x="118" y="300">Spoken input language</text>
    <text class="row-value" x="752" y="300">Deutsch  ⌄</text>
  </g>
  <g id="callout-1">
    <rect class="box" x="860" y="175" width="650" height="170" rx="10"/>
    <circle class="pin" cx="860" cy="209" r="19"/>
    <text class="pin-num" x="860" y="217">1</text>
    <text class="box-head" x="904" y="217">Your input language</text>
    <text class="box-body" x="904" y="255">What the engine listens in, and a property of</text>
    <text class="box-body" x="904" y="281">the project, so two projects can sit in two</text>
    <text class="box-body" x="904" y="307">languages. Shorten the menu on Settings,</text>
    <text class="box-body" x="904" y="333">Languages, under Spoken input.</text>
    <path class="leader" d="M 780.0 300.0 L 802.0 300.0 Q 820.0 300.0 820.0 282.0 L 820.0 227.0 Q 820.0 209.0 838.0 209.0 L 860.0 209.0"/>
    <circle class="dot" cx="780" cy="300" r="5"/>
  </g>
  <g id="recorder-header">
    <rect class="chrome" x="90" y="385" width="690" height="150" rx="16"/>
    <text class="panel-tag" x="118" y="421">LIVE RECORDER</text>
    <circle cx="134" cy="470" r="11" fill="#FF9F0A"/>
    <text class="badge" x="160" y="480">Recording</text>
    <text class="badge" x="390" y="480">Language: Deutsch</text>
  </g>
  <g id="polish-chip">
    <rect class="chrome" x="90" y="585" width="690" height="140" rx="16"/>
    <text class="panel-tag" x="118" y="621">AI SIDEBAR</text>
    <text class="row-label" x="118" y="678" font-size="27" font-weight="700">Polish</text>
    <rect class="chip" x="490" y="652" width="104" height="38" rx="19"/>
    <text class="chip-text" x="542" y="678">Auto</text>
    <rect class="chip" x="610" y="652" width="140" height="38" rx="19"/>
    <text class="chip-text" x="680" y="678">de→en  ⌄</text>
  </g>
  <g id="settings-session-ai">
    <rect class="chrome" x="90" y="775" width="690" height="230" rx="16"/>
    <text class="panel-tag" x="118" y="811">SETTINGS · SESSION AI</text>
    <text class="sec" x="118" y="848">Feedback and polish</text>
    <text class="row-label" x="118" y="910">Translate polish into</text>
    <text class="row-value" x="752" y="910">English  ⌄</text>
    <text class="row-label" x="118" y="972">In the day document</text>
    <text class="row-value" x="752" y="972">Both versions  ⌄</text>
  </g>
  <g id="callout-2">
    <rect class="box" x="860" y="495" width="650" height="175" rx="10"/>
    <circle class="pin" cx="860" cy="529" r="19"/>
    <text class="pin-num" x="860" y="537">2</text>
    <text class="box-head" x="904" y="537">What the engine will actually do</text>
    <text class="box-body" x="904" y="575">The header reports the language the take will</text>
    <text class="box-body" x="904" y="601">really use, not the one the setting holds. It can</text>
    <text class="box-body" x="904" y="627">also read Automatic, or English only on an</text>
    <text class="box-body" x="904" y="653">engine that transcribes English alone.</text>
    <path class="leader" d="M 780.0 470.0 L 802.0 470.0 Q 820.0 470.0 820.0 488.0 L 820.0 511.0 Q 820.0 529.0 838.0 529.0 L 860.0 529.0"/>
    <circle class="dot" cx="780" cy="470" r="5"/>
  </g>
  <g id="callout-3">
    <rect class="box" x="860" y="680" width="650" height="175" rx="10"/>
    <circle class="pin" cx="860" cy="714" r="19"/>
    <text class="pin-num" x="860" y="722">3</text>
    <text class="box-head" x="904" y="722">The chip answers it in the negative too</text>
    <text class="box-body" x="904" y="760">On the Polish heading, showing the pair as a</text>
    <text class="box-body" x="904" y="786">source and a target. With translation off it</text>
    <text class="box-body" x="904" y="812">reads Translate: Off, so the question is always</text>
    <text class="box-body" x="904" y="838">answered. Press it to change either half.</text>
    <path class="leader" d="M 780.0 671.0 L 802.0 671.0 Q 820.0 671.0 820.0 689.0 L 820.0 696.0 Q 820.0 714.0 838.0 714.0 L 860.0 714.0"/>
    <circle class="dot" cx="780" cy="671" r="5"/>
  </g>
  <g id="callout-4">
    <rect class="box" x="860" y="865" width="650" height="180" rx="10"/>
    <circle class="pin" cx="860" cy="899" r="19"/>
    <text class="pin-num" x="860" y="907">4</text>
    <text class="box-head" x="904" y="907">What the polish writes, and what it keeps</text>
    <text class="box-body" x="904" y="945">Translate polish into is the target half. Off is</text>
    <text class="box-body" x="904" y="971">the default. In the day document decides</text>
    <text class="box-body" x="904" y="997">whether your own words stay above the</text>
    <text class="box-body" x="904" y="1023">translation, or are cleared and replaced.</text>
    <path class="leader" d="M 780.0 910.0 L 814.5 910.0 Q 820.0 910.0 820.0 904.5 L 820.0 904.5 Q 820.0 899.0 825.5 899.0 L 860.0 899.0"/>
    <circle class="dot" cx="780" cy="910" r="5"/>
  </g>
  <g id="day-document">
    <rect class="doc" x="90" y="1080" width="1420" height="170" rx="14"/>
    <text class="doc-head" x="122" y="1122">## 07:05  Morning practice</text>
    <text class="doc-body" x="122" y="1170">Ich möchte diese Woche etwas ausprobieren.</text>
    <text class="doc-trans" x="122" y="1216">I want to try something this week.</text>
    <text class="stamp" x="1478" y="1216" text-anchor="end">translation</text>
    <circle class="pin" cx="90" cy="1080" r="19"/>
    <text class="pin-num" x="90" y="1088">5</text>
    <text class="box-head" x="122" y="1080" dy="-18">Both versions keeps your line, and writes the translation under it</text>
  </g>
  <line x1="90" y1="1282" x2="1510" y2="1282" stroke="#3A3A3C" stroke-width="1.5"/>
  <text class="foot" x="90" y="1320"><tspan class="foot-b">Pre-release.</tspan> In the direct Mac download and the iPhone app. The Mac App Store build does not have it. Sample values shown.</text>
</svg>
