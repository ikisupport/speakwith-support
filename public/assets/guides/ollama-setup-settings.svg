<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="720" viewBox="0 0 1480 720" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The Ollama section in Session AI</title>
  <desc>Constructed Session AI form: title tag, polish tag, context step, and keep-warm choice, each labelled with what it costs.</desc>
  <defs>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #F2F2F7; }
      .subtitle { font-size: 18px; fill: #AEAEB2; }
      .win-title { font-size: 15px; font-weight: 650; fill: #F2F2F7; }
      .example { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #FF9F0A; }
      .term { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 16px; fill: #F2F2F7; }
      .prompt { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 16px; fill: #32D74B; }
      .dim { font-size: 14px; fill: #8E8E93; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; fill: #8E8E93; }
      .row { font-size: 16px; font-weight: 600; fill: #F2F2F7; }
      .caption { font-size: 14px; fill: #D1D1D6; }
      .field { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 15px; fill: #F2F2F7; }
      .placeholder { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 14px; fill: #8E8E93; }
      .err { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 14px; font-weight: 650; fill: #FF6961; }
      .pill { font-size: 14px; font-weight: 650; }
      .banner { font-size: 16px; font-weight: 700; fill: #FFD60A; }
      .call-head { font-size: 16px; font-weight: 700; fill: #F2F2F7; }
      .call-body { font-size: 14px; fill: #D1D1D6; }
      .box-call { fill: #262628; stroke: #48484A; stroke-width: 1.5; }
      .leader { stroke: #FF453A; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .pin-num { font-size: 16px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1480" height="720" fill="#1C1C1E"/>
  <rect x="1.5" y="1.5" width="1477" height="717" rx="26" fill="none" stroke="#54545A" stroke-width="3"/>
<rect x="32" y="28" width="860" height="664" rx="14" fill="#2C2C2E" stroke="#3A3A3C" stroke-width="1.5"/>
<circle cx="54" cy="50" r="5.5" fill="#3A3A3C"/>
<circle cx="72" cy="50" r="5.5" fill="#3A3A3C"/>
<circle cx="90" cy="50" r="5.5" fill="#3A3A3C"/>
<text class="win-title" x="462" y="55" text-anchor="middle">Settings  ·  Session AI</text>
<text class="example" x="874" y="54" text-anchor="end">EXAMPLE</text>
<line x1="46" y1="70" x2="878" y2="70" stroke="#3A3A3C" stroke-width="1"/>
<text class="section" x="60" y="106">OLLAMA</text>
<text class="caption" x="60" y="136">Local, no key. Any tag from ollama list. The daemon must be running on this Mac.</text>
<text class="row" x="60" y="196">Title model</text>
<rect x="282" y="172" width="460" height="32" rx="7" fill="#1C1C1E" stroke="#5A5A5E" stroke-width="1.25"/>
<text class="field" x="294" y="193">llama3.1:8b</text>
<text class="row" x="60" y="276">Polish model</text>
<rect x="282" y="252" width="460" height="32" rx="7" fill="#1C1C1E" stroke="#5A5A5E" stroke-width="1.25"/>
<text class="placeholder" x="294" y="273">blank = same as the title model</text>
<text class="row" x="60" y="356">Context</text>
<rect x="282" y="332" width="240" height="32" rx="7" fill="#1C1C1E" stroke="#5A5A5E" stroke-width="1.25"/>
<text class="field" x="294" y="353">16k</text>
<text class="row" x="60" y="436">Keep warm</text>
<rect x="282" y="412" width="240" height="32" rx="7" fill="#1C1C1E" stroke="#5A5A5E" stroke-width="1.25"/>
<text class="field" x="294" y="433">15 minutes</text>
<text class="caption" x="60" y="498">Blank polish uses the title tag. Keep warm holds that title tag only.</text>
<text class="caption" x="60" y="534">Context steps are 4k, 8k, 16k, and 32k. A change of step reloads the model.</text>
<text class="caption" x="60" y="570">Until quit, the last Keep warm choice, lasts until SpeakWith itself quits.</text>
<rect x="60" y="600" width="800" height="88" rx="10" fill="#262628" stroke="#48484A" stroke-width="1.25"/>
<text class="row" x="80" y="634">Title</text>
<text class="field" x="172" y="634">llama3.1:8b</text>
<text class="row" x="452" y="634">Polish</text>
<text class="placeholder" x="552" y="634">same tag, unless you type one</text>
<text class="dim" x="80" y="666">One provider. Both jobs go local, or both go to OpenAI.</text>
  <g id="callout-1">
    <path class="leader" d="M 940 196 L 900 196"/>
    <circle cx="900" cy="196" r="5" fill="#FF453A"/>
    <rect class="box-call" x="940" y="157" width="504" height="78" rx="10"/>
    <text class="call-head" x="980" y="181">The name you type</text>
    <text class="call-body" x="980" y="203">Generate and Warm now use it.</text>
    <text class="call-body" x="980" y="221">Copy it from ollama list.</text>
    <circle cx="960" cy="196" r="13" fill="#FF453A"/>
    <text class="pin-num" x="960" y="201">1</text>
  </g>
  <g id="callout-2">
    <path class="leader" d="M 940.0 288.0 L 924.0 288.0 Q 918.0 288.0 918.0 282.0 L 918.0 282.0 Q 918.0 276.0 912.0 276.0 L 900.0 276.0"/>
    <circle cx="900" cy="276" r="5" fill="#FF453A"/>
    <rect class="box-call" x="940" y="249" width="504" height="78" rx="10"/>
    <text class="call-head" x="980" y="273">Polish can differ</text>
    <text class="call-body" x="980" y="295">Empty stays on the title tag.</text>
    <text class="call-body" x="980" y="313">Another tag loads cold once.</text>
    <circle cx="960" cy="288" r="13" fill="#FF453A"/>
    <text class="pin-num" x="960" y="293">2</text>
  </g>
  <g id="callout-3">
    <path class="leader" d="M 940.0 380.0 L 929.0 380.0 Q 918.0 380.0 918.0 369.0 L 918.0 365.0 Q 918.0 356.0 909.0 356.0 L 900.0 356.0"/>
    <circle cx="900" cy="356" r="5" fill="#FF453A"/>
    <rect class="box-call" x="940" y="341" width="504" height="78" rx="10"/>
    <text class="call-head" x="980" y="365">Memory follows the step</text>
    <text class="call-body" x="980" y="387">Larger context, more memory.</text>
    <text class="call-body" x="980" y="405">Changing it reloads the tag.</text>
    <circle cx="960" cy="380" r="13" fill="#FF453A"/>
    <text class="pin-num" x="960" y="385">3</text>
  </g>
  <g id="callout-4">
    <path class="leader" d="M 940.0 472.0 L 929.0 472.0 Q 918.0 472.0 918.0 461.0 L 918.0 445.0 Q 918.0 436.0 909.0 436.0 L 900.0 436.0"/>
    <circle cx="900" cy="436" r="5" fill="#FF453A"/>
    <rect class="box-call" x="940" y="433" width="504" height="78" rx="10"/>
    <text class="call-head" x="980" y="457">How long it stays</text>
    <text class="call-body" x="980" y="479">15 minutes in this example.</text>
    <text class="call-body" x="980" y="497">Until quit ends when you quit.</text>
    <circle cx="960" cy="472" r="13" fill="#FF453A"/>
    <text class="pin-num" x="960" y="477">4</text>
  </g>
</svg>
