<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Install Ollama and confirm the daemon</title>
  <desc>Constructed menu-bar item and a Terminal version check. The version number is an example.</desc>
  <defs>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #F2F2F7; }
      .subtitle { font-size: 18px; fill: #AEAEB2; }
      .win-title { font-size: 15px; font-weight: 650; fill: #F2F2F7; }
      .example { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #FF9F0A; }
      .term { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 16px; fill: #F2F2F7; }
      .prompt { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 16px; fill: #32D74B; }
      .dim { font-size: 14px; fill: #8E8E93; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; fill: #8E8E93; }
      .row { font-size: 16px; font-weight: 600; fill: #F2F2F7; }
      .caption { font-size: 14px; fill: #D1D1D6; }
      .field { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 15px; fill: #F2F2F7; }
      .placeholder { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 14px; fill: #8E8E93; }
      .err { font-family: ui-monospace, SF Mono, Menlo, Consolas, monospace; font-size: 14px; font-weight: 650; fill: #FF6961; }
      .pill { font-size: 14px; font-weight: 650; }
      .banner { font-size: 16px; font-weight: 700; fill: #FFD60A; }
      .call-head { font-size: 16px; font-weight: 700; fill: #F2F2F7; }
      .call-body { font-size: 14px; fill: #D1D1D6; }
      .box-call { fill: #262628; stroke: #48484A; stroke-width: 1.5; }
      .leader { stroke: #FF453A; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
      .pin-num { font-size: 16px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1280" height="520" fill="#1C1C1E"/>
  <rect x="1.5" y="1.5" width="1277" height="517" rx="26" fill="none" stroke="#54545A" stroke-width="3"/>
<rect x="36" y="28" width="740" height="230" rx="14" fill="#2C2C2E" stroke="#3A3A3C" stroke-width="1.5"/>
<circle cx="58" cy="50" r="5.5" fill="#3A3A3C"/>
<circle cx="76" cy="50" r="5.5" fill="#3A3A3C"/>
<circle cx="94" cy="50" r="5.5" fill="#3A3A3C"/>
<text class="win-title" x="406" y="55" text-anchor="middle">Menu bar</text>
<text class="example" x="758" y="54" text-anchor="end">EXAMPLE</text>
<line x1="50" y1="70" x2="762" y2="70" stroke="#3A3A3C" stroke-width="1"/>
<rect x="60" y="96" width="692" height="36" rx="8" fill="#0E0E10"/>
<circle cx="640" cy="116" r="9" fill="none" stroke="#FF9F0A" stroke-width="1.7"/>
<ellipse cx="633" cy="108" rx="3.2" ry="5" fill="none" stroke="#FF9F0A" stroke-width="1.5"/>
<ellipse cx="647" cy="108" rx="3.2" ry="5" fill="none" stroke="#FF9F0A" stroke-width="1.5"/>
<text class="term" x="658" y="119">ollama</text>
<rect x="520" y="144" width="230" height="88" rx="10" fill="#2C2C2E" stroke="#5A5A5E" stroke-width="1.25"/>
<text class="row" x="540" y="176">ollama is running</text>
<text class="caption" x="540" y="206">Quit Ollama</text>
<rect x="36" y="274" width="740" height="214" rx="14" fill="#2C2C2E" stroke="#3A3A3C" stroke-width="1.5"/>
<circle cx="58" cy="296" r="5.5" fill="#3A3A3C"/>
<circle cx="76" cy="296" r="5.5" fill="#3A3A3C"/>
<circle cx="94" cy="296" r="5.5" fill="#3A3A3C"/>
<text class="win-title" x="406" y="301" text-anchor="middle">Terminal</text>
<text class="example" x="758" y="300" text-anchor="end">EXAMPLE</text>
<line x1="50" y1="316" x2="762" y2="316" stroke="#3A3A3C" stroke-width="1"/>
<rect x="56" y="330" width="700" height="130" rx="10" fill="#0E0E10"/>
<text class="prompt" x="76" y="368">$ ollama --version</text>
<text class="term" x="76" y="404">ollama version 0.11.4</text>
<text class="dim" x="76" y="438">Any current release. The line only proves the command exists.</text>
  <g id="callout-1">
    <path class="leader" d="M 812 114 L 784 114"/>
    <circle cx="784" cy="114" r="5" fill="#FF453A"/>
    <rect class="box-call" x="812" y="75" width="432" height="78" rx="10"/>
    <text class="call-head" x="852" y="99">The daemon</text>
    <text class="call-body" x="852" y="121">This menu-bar item is it.</text>
    <text class="call-body" x="852" y="139">It is set to open at login.</text>
    <circle cx="832" cy="114" r="13" fill="#FF453A"/>
    <text class="pin-num" x="832" y="119">1</text>
  </g>
  <g id="callout-2">
    <path class="leader" d="M 812 404 L 784 404"/>
    <circle cx="784" cy="404" r="5" fill="#FF453A"/>
    <rect class="box-call" x="812" y="365" width="432" height="78" rx="10"/>
    <text class="call-head" x="852" y="389">The check</text>
    <text class="call-body" x="852" y="411">A version line means installed.</text>
    <text class="call-body" x="852" y="429">Quit the item and titles cannot connect.</text>
    <circle cx="832" cy="404" r="13" fill="#FF453A"/>
    <text class="pin-num" x="832" y="409">2</text>
  </g>
</svg>
