<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="840" viewBox="0 0 1480 840" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Terminal running the chapter 4 prompt</title>
  <desc>A terminal in lighthouse-book. Claude Code is running the SpeakWith prompt and has written chapters/04-the-storm.md from those notes.</desc>
  <defs><style>
      .title { font-size: 32px; font-weight: 700; fill: #F2F2F7; }
      .sub { font-size: 18px; fill: #AEAEB2; }
      .card { fill: #232325; stroke: #3A3A3C; stroke-width: 1.5; }
      .head { font-size: 20px; font-weight: 650; fill: #F2F2F7; }
      .lbl { font-size: 16px; fill: #AEAEB2; }
      .val { font-size: 16px; fill: #F2F2F7; }
      .strong { font-size: 17px; font-weight: 650; fill: #F2F2F7; }
      .body { font-size: 15px; fill: #AEAEB2; }
      .off { font-size: 17px; fill: #636366; }
      .offbody { font-size: 15px; fill: #636366; }
      .cap { font-size: 15px; fill: #8E8E93; }
      .tile { fill: #2C2C2E; stroke: #3A3A3C; stroke-width: 1; }
      .field { fill: #2C2C2E; stroke: #48484A; stroke-width: 1.5; }
      .box { fill: #262628; stroke: #48484A; stroke-width: 1.5; }
      .box-head { font-size: 18px; font-weight: 700; fill: #F2F2F7; }
      .box-body { font-size: 16px; fill: #D1D1D6; }
      .doc-h { font-size: 18px; font-weight: 700; fill: #F2F2F7; }
      .doc { font-size: 16px; fill: #F2F2F7; }
      .pin-num { font-size: 20px; font-weight: 700; fill: #1C1C1E; text-anchor: middle; }
      .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px; fill: #F2F2F7; }
      .mono-dim { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #8E8E93; }
      .mono-prompt { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 650; fill: #32D74B; }
      .mono-h { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 700; fill: #F2F2F7; }
    </style></defs>
  <rect width="1480" height="840" fill="#1C1C1E"/>
  <rect x="1.5" y="1.5" width="1477" height="837" rx="24.9" fill="none" stroke="#54545A" stroke-width="3"/>
  <text class="title" x="64" y="72">In the terminal</text>
  <text class="sub" x="64" y="108">Open a session. Claude Code writes the chapter in lighthouse-book.</text>
  <defs><clipPath id="termwin"><rect x="64" y="140" width="820" height="640" rx="12"/></clipPath></defs>
  <g clip-path="url(#termwin)">
  <rect x="64" y="140" width="820" height="640" fill="#141416" stroke="#3A3A3C" stroke-width="1.5"/>
  <rect x="64" y="140" width="820" height="44" fill="#2A2A2C"/>
  <line x1="64" y1="184" x2="884" y2="184" stroke="#3A3A3C" stroke-width="1"/>
  <circle cx="88" cy="166" r="6" fill="#FF5F57"/>
  <circle cx="108" cy="166" r="6" fill="#FEBC2E"/>
  <circle cx="128" cy="166" r="6" fill="#28C840"/>
  <text class="lbl" x="474" y="172" text-anchor="middle">lighthouse-book · Claude Code</text>
  <text class="mono-prompt" x="88" y="214">lighthouse-book % claude</text>
  <text class="mono-dim" x="88" y="258">YOU</text>
  <text class="mono" x="88" y="284">The following are topics from my day document in SpeakWith.</text>
  <text class="mono" x="88" y="308">Work on them in this project.</text>
  <text class="mono" x="88" y="348">Write chapter 4 from these notes only, as chapters/04-the-storm.md.</text>
  <text class="mono" x="88" y="372">Keep every name as written. Do not add a character.</text>
  <text class="mono-h" x="88" y="412">## The storm scene</text>
  <text class="mono" x="88" y="436">The keeper hears the lantern glass crack. The light goes out.</text>
  <text class="mono" x="88" y="460">She counts thirty seconds of dark before the backup lamp catches.</text>
  <text class="mono-h" x="88" y="500">## Names to keep</text>
  <text class="mono" x="88" y="524">The keeper is Mara Voss. Her brother, still on the mainland, is Eli Voss.</text>
  <text class="mono" x="88" y="548">The supply boat is called Cormorant.</text>
  <text class="mono-dim" x="88" y="588">CLAUDE</text>
  <text class="mono" x="88" y="614">Wrote chapters/04-the-storm.md</text>
  <rect x="338" y="202" width="9" height="16" rx="1" fill="#32D74B"/>
  <rect x="88" y="636" width="772" height="116" rx="8" fill="#2C2C2E" stroke="#3A3A3C"/>
  <text class="mono-h" x="104" y="664"># The storm scene</text>
  <text class="mono" x="104" y="688">The keeper hears the lantern glass crack. The light goes out.</text>
  <text class="mono" x="104" y="724">The keeper is Mara Voss. The supply boat is called Cormorant.</text>
  </g>
  <rect x="64" y="140" width="820" height="640" rx="12" fill="none" stroke="#3A3A3C" stroke-width="1.5"/>
  <g>
    <rect class="box" x="940" y="160" width="480" height="100" rx="10"/>
    <circle cx="962" cy="188" r="16" fill="#FF9F0A"/>
    <text x="962" y="195" class="pin-num">1</text>
    <text class="box-head" x="988" y="194">The folder</text>
    <text class="box-body" x="988" y="222">This window is the manuscript, lighthouse-book.</text>
  </g>
  <g>
    <rect class="box" x="940" y="340" width="480" height="100" rx="10"/>
    <circle cx="962" cy="368" r="16" fill="#FF9F0A"/>
    <text x="962" y="375" class="pin-num">2</text>
    <text class="box-head" x="988" y="374">The prompt</text>
    <text class="box-body" x="988" y="402">The message from the previous section, now running.</text>
  </g>
  <g>
    <rect class="box" x="940" y="640" width="480" height="100" rx="10"/>
    <circle cx="962" cy="668" r="16" fill="#FF9F0A"/>
    <text x="962" y="675" class="pin-num">3</text>
    <text class="box-head" x="988" y="674">The file</text>
    <text class="box-body" x="988" y="702">chapters/04-the-storm.md, written from those notes.</text>
  </g>
</svg>
