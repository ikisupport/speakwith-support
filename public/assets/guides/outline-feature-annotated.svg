<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1620" viewBox="0 0 1600 1620" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>SpeakWith Outline: five recordings, before and after one Outline edit</title>
  <desc>Two before-and-after figures. Each shows the same five recorded text blocks, every block with its recorded time, a heading, and the spoken words. Figure 1: on the right the second recording is nested one step under the first; the spoken order is unchanged. Figure 2: on the right the fifth recording has moved up between the second and the third, and nothing is indented. The words are identical on both sides; only placement changes.</desc>
  <!--
    Maintainer note (not rendered):
    - Column A is the day document as recorded (every live session files as a `##` heading, MainSidebarOutlineRow.swift).
    - Figure 1, column B: one-step indent, `##` to `###`. A pure re-level changes no order, so no `ts` marker is stripped (day_doc_apply_outline.rs).
    - Figure 2, column B: reorder 1, 2, 5, 3, 4; the moved unit's `ts` marker no longer ascends and is dropped on Apply.
    - A curved accent arrow runs from the moved block in A to its place in B; Figure 1 also draws a dashed
      ghost at the block's original flush position behind the nested block.
    - A drop is a preview until Apply writes it (DayDocOutlineMove.swift); Undo takes back the last drag.
    - The SpeakWith wordmark sits on the title row and again on each figure's column-header row,
      right-aligned to column B, so a crop of either figure still carries the product name.
    - Regenerate with guide_design/outline_feature/gen_outline_feature.py <outdir> (dark).
  -->
