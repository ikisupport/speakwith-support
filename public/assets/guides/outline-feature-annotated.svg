      .time { font-size: 15px; font-family: SF Mono, Menlo, Consolas, monospace; fill: #8E8E93; text-anchor: end; }
      .badge { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .caption { font-size: 20px; fill: #AEAEB2; }
      .caption-n { font-weight: 700; fill: #F2F2F7; }
      .caption-lead { font-weight: 700; fill: #F2F2F7; }
      .note { font-size: 16px; fill: #8E8E93; font-style: italic; }
      .brand { font-size: 22px; font-weight: 700; fill: #F2F2F7; text-anchor: end; letter-spacing: 0.01em; }
